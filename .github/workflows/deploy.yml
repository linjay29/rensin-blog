name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ⚠️ cancel-in-progress 必須是 false。
#
# 它取消得掉的只有 GitHub Actions 這邊的 workflow run，
# 取消不掉 GitHub 伺服器端已經開始的 Pages deployment。
# 連續推兩個 commit 時，前一個 run 被砍掉，但它建立的 Pages deployment
# 仍留在 in progress，接著後面每一次部署都會撞上：
#
#   Deployment request failed for <sha> due to in progress deployment.
#   Please cancel <前一個 sha> first or wait for it to complete.
#
# 而且那個部署會一直卡著，不會自己結束，等於整個 Pages 就此鎖死
# （2026-08-27 實際踩過，最後是打 API 手動取消才解開：
#    gh api -X POST repos/OWNER/REPO/pages/deployments/<sha>/cancel）
#
# 改成 false 之後，同時間的 run 會排隊而不是互砍，部署依序完成。
# 代價是連續推送時後一次要等前一次跑完，對這種規模的站台無所謂。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 先跑建置腳本：重算每篇的最後更新日期、重建首頁卡片與 sitemap，
  # 產出的 public/ 交給兩個部署 job 使用。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # build.mjs 需要完整歷史才能讀到每個檔案的 commit 日期
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tools/build.mjs

      # 草稿不上線。deploy 是把整個 public/ 上傳，
      # 所以 _draft- 開頭的資料夾雖然首頁沒有連結，網址打對還是開得起來。
      # 在打包前把它們從「要部署的那一份」刪掉；本機的 public/ 不受影響。
      - name: 移除草稿，不讓它們部署出去
        run: |
          shopt -s nullglob
          for d in public/_draft-*/; do
            echo "  排除草稿：$d"
            rm -rf "$d"
          done
        shell: bash
      - uses: actions/upload-artifact@v5   # v4 仍跑在已棄用的 Node 20 上
        with:
          name: site
          path: public
          retention-days: 1

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: public
      - uses: actions/configure-pages@v5
        with:
          enablement: true      # repo 還沒開 Pages 時自動開啟（需該方案支援）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # ⚠️ 這個 job 失敗時，不要用「Re-run failed jobs」。
      # 重跑會在同一個 run 裡再上傳一份同名的 github-pages artifact，
      # 接著 deploy-pages 會因為找到兩份而失敗：
      #   Multiple artifacts named "github-pages" ... Artifact count is 2.
      # 正確做法是開一個全新的 run：gh workflow run Deploy --ref main

  cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: public

      # 還沒設定 secrets 時就跳過，不要讓整個 workflow 亮紅燈
      - id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=略過 Cloudflare Pages::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=rensin-blog --branch=main
